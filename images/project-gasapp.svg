<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc" font-family="ui-monospace, Menlo, Consolas, monospace">
  <title id="title">Gasapp mock-up: four apps</title>
  <desc id="desc">Four phones side by side. The customer app orders a gas cylinder, the vendor app lists new orders, the driver app shows a map route to a delivery pin, and the admin app shows a sales chart.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2" height="6" fill="#111"/>
    </pattern>
  </defs>

  <!-- Customer app -->
  <rect x="41" y="46" width="120" height="240" rx="18" fill="#111"/>
  <rect x="35" y="40" width="120" height="240" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
  <rect x="77" y="49" width="36" height="6" rx="3" fill="#111"/>
  <text x="47" y="76" font-size="8" fill="#555">Hi, Ada</text>
  <text x="47" y="92" font-size="11" font-weight="700" fill="#111">Order gas</text>
  <rect x="77" y="268" width="36" height="3" rx="1.5" fill="#111"/>
  <rect x="87" y="104" width="16" height="10" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="75" y="112" width="40" height="54" rx="9" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <rect x="77" y="114" width="36" height="50" rx="7" fill="url(#hatch)" opacity="0.2"/>
  <rect x="75" y="132" width="40" height="8" fill="#1e4d2b"/>
  <rect x="47" y="178" width="44" height="20" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="69" y="191.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#111">6 KG</text>
  <rect x="99" y="178" width="44" height="20" fill="#111"/>
  <text x="121" y="191.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff">12.5 KG</text>
  <rect x="47" y="208" width="96" height="26" fill="#1e4d2b"/>
  <text x="95" y="224.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">ORDER NOW</text>

  <!-- Vendor app -->
  <rect x="191" y="46" width="120" height="240" rx="18" fill="#111"/>
  <rect x="185" y="40" width="120" height="240" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
  <rect x="227" y="49" width="36" height="6" rx="3" fill="#111"/>
  <text x="197" y="76" font-size="8" fill="#555">Vendor</text>
  <text x="197" y="92" font-size="11" font-weight="700" fill="#111">New orders</text>
  <rect x="227" y="268" width="36" height="3" rx="1.5" fill="#111"/>
  <rect x="197" y="104" width="96" height="28" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <rect x="197" y="104" width="5" height="28" fill="#1e4d2b"/>
  <circle cx="212" cy="118" r="5" fill="url(#hatch)" stroke="#111" stroke-width="1.5"/>
  <text x="222" y="121" font-size="7.5" fill="#111">#1042</text>
  <text x="287" y="121" text-anchor="end" font-size="7.5" font-weight="700" fill="#111">12.5 kg</text>
  <rect x="197" y="138" width="96" height="28" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="212" cy="152" r="5" fill="url(#hatch)" stroke="#111" stroke-width="1.5"/>
  <text x="222" y="155" font-size="7.5" fill="#111">#1041</text>
  <text x="287" y="155" text-anchor="end" font-size="7.5" font-weight="700" fill="#111">6 kg</text>
  <rect x="197" y="172" width="96" height="28" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="212" cy="186" r="5" fill="url(#hatch)" stroke="#111" stroke-width="1.5"/>
  <text x="222" y="189" font-size="7.5" fill="#111">#1040</text>
  <text x="287" y="189" text-anchor="end" font-size="7.5" font-weight="700" fill="#111">12.5 kg</text>
  <rect x="197" y="206" width="96" height="28" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="212" cy="220" r="5" fill="url(#hatch)" stroke="#111" stroke-width="1.5"/>
  <text x="222" y="223" font-size="7.5" fill="#111">#1039</text>
  <text x="287" y="223" text-anchor="end" font-size="7.5" font-weight="700" fill="#111">25 kg</text>

  <!-- Driver app -->
  <rect x="341" y="46" width="120" height="240" rx="18" fill="#111"/>
  <rect x="335" y="40" width="120" height="240" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
  <rect x="377" y="49" width="36" height="6" rx="3" fill="#111"/>
  <text x="347" y="76" font-size="8" fill="#555">Driver</text>
  <text x="347" y="92" font-size="11" font-weight="700" fill="#111">Delivery</text>
  <rect x="377" y="268" width="36" height="3" rx="1.5" fill="#111"/>
  <rect x="347" y="102" width="96" height="112" fill="#f4f4f1" stroke="#111" stroke-width="1.5"/>
  <path d="M347 140 H443" stroke="#111" stroke-opacity="0.12" stroke-width="7"/>
  <path d="M347 186 H443" stroke="#111" stroke-opacity="0.12" stroke-width="7"/>
  <path d="M375 102 V214" stroke="#111" stroke-opacity="0.12" stroke-width="7"/>
  <path d="M415 102 V214" stroke="#111" stroke-opacity="0.12" stroke-width="7"/>
  <path d="M359 200 V164 H395 V128 H427" fill="none" stroke="#111" stroke-width="2.5" stroke-dasharray="5 3"/>
  <circle cx="359" cy="200" r="4.5" fill="#111"/>
  <path d="M427 130 C416 118 418 104 427 104 C436 104 438 118 427 130 Z" fill="#1e4d2b" stroke="#111" stroke-width="1.5"/>
  <circle cx="427" cy="114" r="3.5" fill="#fff"/>
  <text x="347" y="232" font-size="9" font-weight="700" fill="#111">ETA 12 min</text>
  <text x="443" y="232" text-anchor="end" font-size="8" fill="#555">4.2 km</text>
  <rect x="347" y="240" width="96" height="5" fill="#111" opacity="0.2"/>
  <rect x="347" y="240" width="62" height="5" fill="#111"/>

  <!-- Admin app -->
  <rect x="491" y="46" width="120" height="240" rx="18" fill="#111"/>
  <rect x="485" y="40" width="120" height="240" rx="18" fill="#fff" stroke="#111" stroke-width="3"/>
  <rect x="527" y="49" width="36" height="6" rx="3" fill="#111"/>
  <text x="497" y="76" font-size="8" fill="#555">Admin</text>
  <text x="497" y="92" font-size="11" font-weight="700" fill="#111">Today</text>
  <rect x="527" y="268" width="36" height="3" rx="1.5" fill="#111"/>
  <rect x="497" y="102" width="96" height="48" fill="#111"/>
  <text x="507" y="119" font-size="7.5" fill="#fff" opacity="0.75">ORDERS</text>
  <text x="507" y="141" font-size="18" font-weight="700" fill="#fff">128</text>
  <text x="497" y="170" font-size="8" fill="#555">Sales this week</text>
  <rect x="501" y="216" width="10" height="24" fill="#111"/>
  <rect x="516" y="200" width="10" height="40" fill="#111"/>
  <rect x="531" y="208" width="10" height="32" fill="#111"/>
  <rect x="546" y="188" width="10" height="52" fill="#111"/>
  <rect x="561" y="196" width="10" height="44" fill="#111"/>
  <rect x="576" y="178" width="10" height="62" fill="#1e4d2b"/>
  <line x1="497" y1="240.75" x2="593" y2="240.75" stroke="#111" stroke-width="1.5"/>

  <!-- Labels -->
  <text x="95" y="308" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#111">CUSTOMER</text>
  <text x="245" y="308" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#111">VENDOR</text>
  <text x="395" y="308" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#111">DRIVER</text>
  <text x="545" y="308" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#111">ADMIN</text>
  <line x1="95" y1="332" x2="545" y2="332" stroke="#111" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="95" cy="332" r="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <circle cx="245" cy="332" r="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <circle cx="395" cy="332" r="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <circle cx="545" cy="332" r="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <circle cx="395" cy="332" r="3" fill="#1e4d2b"/>
  <text x="320" y="366" text-anchor="middle" font-size="10" letter-spacing="2" fill="#555">ONE PLATFORM · FOUR APPS</text>
</svg>
