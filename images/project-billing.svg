<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc" font-family="ui-monospace, Menlo, Consolas, monospace">
  <title id="title">Billing and invoicing app mock-up</title>
  <desc id="desc">A phone showing units left on an electricity meter, a Buy units button and recent payments, next to a PDF icon and a paid invoice.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2" height="6" fill="#111"/>
    </pattern>
  </defs>

  <!-- Lightning bolt badge -->
  <circle cx="110" cy="138" r="54" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="110" cy="138" r="44" fill="url(#hatch)" opacity="0.18"/>
  <path d="M120 100 L88 146 H108 L98 178 L134 126 H112 Z" fill="#1e4d2b" stroke="#111" stroke-width="3" stroke-linejoin="round"/>

  <!-- PDF file icon -->
  <g transform="translate(80 236)">
    <path d="M6 6 H50 L66 22 V86 H6 Z" fill="#111"/>
    <path d="M0 0 H44 L60 16 V80 H0 Z" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <path d="M44 0 V16 H60" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <rect x="8" y="44" width="44" height="18" fill="#111"/>
    <text x="30" y="57.5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">PDF</text>
  </g>

  <!-- Paid invoice -->
  <g transform="rotate(6 470 190)">
    <rect x="394" y="72" width="170" height="232" fill="#111"/>
    <rect x="388" y="66" width="170" height="232" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="404" y="98" font-size="16" font-weight="700" fill="#111">INVOICE</text>
    <text x="404" y="116" font-size="10" fill="#555">No. 00482</text>
    <rect x="404" y="134" width="138" height="4" fill="#111"/>
    <rect x="404" y="148" width="110" height="4" fill="#111"/>
    <rect x="404" y="162" width="124" height="4" fill="#111"/>
    <rect x="404" y="176" width="90" height="4" fill="#111"/>
    <line x1="404" y1="196" x2="542" y2="196" stroke="#111" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="404" y="218" font-size="11" fill="#111">Total</text>
    <text x="542" y="218" text-anchor="end" font-size="12" font-weight="700" fill="#111">NGN 5,000</text>
    <g transform="rotate(-14 472 256)">
      <rect x="430" y="238" width="84" height="34" fill="none" stroke="#1e4d2b" stroke-width="3"/>
      <text x="472" y="261" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="3" fill="#1e4d2b">PAID</text>
    </g>
  </g>

  <!-- Phone -->
  <rect x="207" y="31" width="190" height="352" rx="26" fill="#111"/>
  <rect x="200" y="24" width="190" height="352" rx="26" fill="#fff" stroke="#111" stroke-width="4"/>
  <rect x="268" y="36" width="54" height="8" rx="4" fill="#111"/>

  <text x="216" y="72" font-size="10" fill="#555">Hello, Ada</text>
  <text x="216" y="90" font-size="13" font-weight="700" fill="#111">My meter</text>

  <rect x="216" y="102" width="158" height="80" fill="#111"/>
  <text x="228" y="122" font-size="9" fill="#fff" opacity="0.75">UNITS LEFT</text>
  <text x="228" y="154" font-size="26" font-weight="700" fill="#fff">42.5</text>
  <text x="302" y="154" font-size="11" fill="#fff">kWh</text>
  <path d="M356 112 L344 130 H352 L347 146 L362 124 H354 Z" fill="#fff"/>
  <rect x="228" y="166" width="134" height="6" fill="#fff" opacity="0.3"/>
  <rect x="228" y="166" width="84" height="6" fill="#fff"/>

  <rect x="216" y="194" width="74" height="34" fill="#1e4d2b"/>
  <text x="253" y="215" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">BUY UNITS</text>
  <rect x="300" y="194" width="74" height="34" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="337" y="215" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111">INVOICES</text>

  <text x="216" y="250" font-size="10.5" font-weight="700" fill="#111">Recent payments</text>

  <rect x="216" y="260" width="158" height="28" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="230" cy="274" r="6" fill="url(#hatch)" stroke="#111" stroke-width="1.5"/>
  <text x="242" y="277.5" font-size="9" fill="#111">12 Nov · Token</text>
  <text x="366" y="277.5" text-anchor="end" font-size="9" font-weight="700" fill="#111">5,000</text>

  <rect x="216" y="294" width="158" height="28" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="230" cy="308" r="6" fill="url(#hatch)" stroke="#111" stroke-width="1.5"/>
  <text x="242" y="311.5" font-size="9" fill="#111">28 Oct · Token</text>
  <text x="366" y="311.5" text-anchor="end" font-size="9" font-weight="700" fill="#111">3,500</text>

  <rect x="216" y="328" width="158" height="28" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="230" cy="342" r="6" fill="url(#hatch)" stroke="#111" stroke-width="1.5"/>
  <text x="242" y="345.5" font-size="9" fill="#111">09 Oct · Token</text>
  <text x="366" y="345.5" text-anchor="end" font-size="9" font-weight="700" fill="#111">4,000</text>

  <rect x="265" y="364" width="60" height="4" rx="2" fill="#111"/>
</svg>
